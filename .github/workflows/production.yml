name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hjlarrea/cololabs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build and check production
        run: |
          make publish
          python scripts/check_build.py output production
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
