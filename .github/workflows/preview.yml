name: Deploy preview

on:
  push:
    branches: [main, 'proposals/**']
  workflow_dispatch:

permissions:
  contents: read

# This is one shared preview site. The latest deployment replaces the previous one.
concurrency:
  group: preview-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hjlarrea/cololabs-preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build preview
        env:
          PREVIEW_SITEURL: ${{ steps.pages.outputs.base_url }}
          PREVIEW_COMMIT: ${{ github.sha }}
        run: |
          make preview
          python scripts/check_build.py output preview
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('output/preview.json').write_text(json.dumps({
              'commit': os.environ['PREVIEW_COMMIT'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Review details
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Preview: %s\n\nCommit: `%s`\n\nBranch: `%s`\n' "$PREVIEW_URL" "$GITHUB_SHA" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
