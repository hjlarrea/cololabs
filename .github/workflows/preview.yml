name: Deploy preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# This is one shared preview site. The latest deployment replaces the previous one.
concurrency:
  group: preview-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'hjlarrea/cololabs-preview' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build preview
        env:
          PREVIEW_SITEURL: https://preview.cololabs.com.ar
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          make preview
          python scripts/check_build.py output preview
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('output/preview.json').write_text(json.dumps({
              'commit': os.environ['PREVIEW_COMMIT'],
              'branch': os.environ['PREVIEW_BRANCH'],
              'build_commit': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Review details
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Preview: %s\n\nCommit: `%s`\n\nBranch: `%s`\n' "$PREVIEW_URL" "$GITHUB_SHA" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
