name: Validate site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Pelican builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Validate preview and production separately
        run: |
          make preview OUTPUTDIR="$RUNNER_TEMP/preview"
          python scripts/check_build.py "$RUNNER_TEMP/preview" preview
          make publish OUTPUTDIR="$RUNNER_TEMP/production"
          python scripts/check_build.py "$RUNNER_TEMP/production" production
